name: 'Ani Secret & Vulnerability Scanner'
description: 'Automated secret detection and dependency vulnerability auditing for Pull Requests'
author: 'Ani'

inputs:
  scan-path:
    description: 'Path to scan inside the target repository'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Scanner Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f ${{ github.action_path }}/requirements-cli.txt ]; then
          pip install -r ${{ github.action_path }}/requirements-cli.txt
        fi

    - name: Run Security Scan
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
      run: python -m src.cli.main --path ${{ inputs.scan-path }}